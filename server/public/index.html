<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM & Zoho Books Integration Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .badge-received { background-color: #e0f2fe; color: #0369a1; }
    .badge-processing { background-color: #fef3c7; color: #b45309; }
    .badge-processed { background-color: #dcfce7; color: #15803d; }
    .badge-failed { background-color: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [operatorKey, setOperatorKey] = useState(
        localStorage.getItem('OPERATOR_KEY') || 'operator_secure_dev_key_2026'
      );
      const [showKeyModal, setShowKeyModal] = useState(false);
      const [tempKey, setTempKey] = useState(operatorKey);
      const [autoRefresh, setAutoRefresh] = useState(false);
      const [refreshInterval, setRefreshInterval] = useState(15000); // 15s
      const [toast, setToast] = useState(null);

      // Confirmation Modal State
      const [confirmModal, setConfirmModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        actionType: null,
        payload: null,
        isExecuting: false
      });

      // Data States
      const [summary, setSummary] = useState(null);
      const [collectionsData, setCollectionsData] = useState(null);
      const [logsData, setLogsData] = useState(null);
      const [eventsData, setEventsData] = useState(null);
      const [exceptionsData, setExceptionsData] = useState(null);
      const [loading, setLoading] = useState(true);

      // Filter States
      const [collectionsSearch, setCollectionsSearch] = useState('');
      const [collectionsPage, setCollectionsPage] = useState(1);
      const [logsPage, setLogsPage] = useState(1);
      const [logsFilter, setLogsFilter] = useState({ system: '', isSuccess: '', search: '' });

      // Selected Candidate for Ambiguity resolution
      const [selectedCandidates, setSelectedCandidates] = useState({});

      const showToastMessage = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const fetchAllData = useCallback(async () => {
        setLoading(true);
        try {
          const [sumRes, collRes, logsRes, eventsRes, exRes] = await Promise.all([
            fetch('/api/dashboard/summary').then((r) => r.json()),
            fetch(`/api/dashboard/collections?page=${collectionsPage}&limit=10&search=${encodeURIComponent(collectionsSearch)}`).then((r) => r.json()),
            fetch(`/api/dashboard/logs?page=${logsPage}&limit=15&system=${logsFilter.system}&isSuccess=${logsFilter.isSuccess}&search=${encodeURIComponent(logsFilter.search)}`).then((r) => r.json()),
            fetch('/api/dashboard/events?limit=15').then((r) => r.json()),
            fetch('/api/dashboard/exceptions').then((r) => r.json())
          ]);

          if (sumRes.success) setSummary(sumRes.data);
          if (collRes.success) setCollectionsData(collRes.data);
          if (logsRes.success) setLogsData(logsRes.data);
          if (eventsRes.success) setEventsData(eventsRes.data);
          if (exRes.success) setExceptionsData(exRes.data);
        } catch (err) {
          showToastMessage('Failed to fetch dashboard data: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      }, [collectionsPage, collectionsSearch, logsPage, logsFilter]);

      useEffect(() => {
        fetchAllData();
      }, [fetchAllData]);

      // Auto Refresh Effect
      useEffect(() => {
        if (!autoRefresh) return;
        const interval = setInterval(fetchAllData, refreshInterval);
        return () => clearInterval(interval);
      }, [autoRefresh, refreshInterval, fetchAllData]);

      // Execute Operator Actions
      const handleExecuteOperatorAction = async () => {
        if (!confirmModal.actionType || !confirmModal.payload) return;
        setConfirmModal((prev) => ({ ...prev, isExecuting: true }));

        const headers = {
          'Content-Type': 'application/json',
          'X-Operator-Key': operatorKey
        };

        try {
          let res;
          const { actionType, payload } = confirmModal;

          if (actionType === 'RETRY_EVENT') {
            res = await fetch(`/api/operator/retry-event/${payload.eventId}`, { method: 'POST', headers });
          } else if (actionType === 'RETRY_HUBSPOT') {
            res = await fetch(`/api/operator/retry-hubspot-sync/${payload.crmDealId}`, { method: 'POST', headers });
          } else if (actionType === 'RETRY_RECONCILIATION') {
            res = await fetch(`/api/operator/retry-reconciliation/${payload.crmDealId}`, { method: 'POST', headers });
          } else if (actionType === 'RESOLVE_CUSTOMER') {
            res = await fetch(`/api/operator/resolve-customer`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                mappingId: payload.mappingId,
                chosenZohoContactId: payload.chosenZohoContactId,
                reason: 'Resolved by operator via dashboard'
              })
            });
          } else if (actionType === 'SYNC_PAYMENTS') {
            res = await fetch(`/api/operator/sync-payments/${payload.crmDealId}`, { method: 'POST', headers });
          }

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.message || data.error || 'Action failed');
          }

          showToastMessage('Action executed successfully!');
          setConfirmModal({ isOpen: false, title: '', message: '', actionType: null, payload: null, isExecuting: false });
          fetchAllData();
        } catch (err) {
          showToastMessage('Operator action error: ' + err.message, 'error');
          setConfirmModal((prev) => ({ ...prev, isExecuting: false }));
        }
      };

      const formatCurrency = (val, code = 'AED') => {
        if (val === null || val === undefined || isNaN(val)) return '—';
        return `${Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${code}`;
      };

      const totalExceptions =
        (exceptionsData?.summary?.ambiguousCustomersCount || 0) +
        (exceptionsData?.summary?.reconciliationRequiredCount || 0) +
        (exceptionsData?.summary?.hubspotSyncFailedCount || 0) +
        (exceptionsData?.summary?.failedWebhookEventsCount || 0);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">
                  Z
                </div>
                <div>
                  <h1 className="text-lg font-bold text-slate-900 leading-tight">CRM & Zoho Books Gateway</h1>
                  <p className="text-xs text-slate-500 font-medium">Direct Financial Integration & Operations Dashboard</p>
                </div>
                <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800">
                  <span className="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  Online
                </span>
              </div>

              {/* Actions & Operator Key */}
              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setShowKeyModal(true)}
                  className="inline-flex items-center px-3 py-1.5 border border-slate-300 shadow-sm text-xs font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 focus:outline-none"
                >
                  <span className="w-2 h-2 mr-1.5 rounded-full bg-indigo-500"></span>
                  Operator Auth
                </button>

                <div className="flex items-center space-x-2 border-l border-slate-200 pl-3">
                  <button
                    onClick={() => setAutoRefresh(!autoRefresh)}
                    className={`px-2.5 py-1.5 rounded-md text-xs font-medium transition ${
                      autoRefresh ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    Auto-Refresh {autoRefresh ? 'ON' : 'OFF'}
                  </button>

                  <button
                    onClick={fetchAllData}
                    disabled={loading}
                    className="inline-flex items-center px-3 py-1.5 border border-transparent shadow-sm text-xs font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none disabled:opacity-50"
                  >
                    {loading ? 'Refreshing...' : 'Refresh'}
                  </button>
                </div>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8 border-t border-slate-100">
              <button
                onClick={() => setActiveTab('overview')}
                className={`py-3 px-1 border-b-2 font-medium text-sm transition ${
                  activeTab === 'overview'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                }`}
              >
                Financial Overview
              </button>

              <button
                onClick={() => setActiveTab('collections')}
                className={`py-3 px-1 border-b-2 font-medium text-sm transition ${
                  activeTab === 'collections'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                }`}
              >
                Collections & Aging
              </button>

              <button
                onClick={() => setActiveTab('logs')}
                className={`py-3 px-1 border-b-2 font-medium text-sm transition ${
                  activeTab === 'logs'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                }`}
              >
                Integration Monitoring & Logs
              </button>

              <button
                onClick={() => setActiveTab('operator')}
                className={`py-3 px-1 border-b-2 font-medium text-sm flex items-center space-x-2 transition ${
                  activeTab === 'operator'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                }`}
              >
                <span>Operator Action Center</span>
                {totalExceptions > 0 && (
                  <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">
                    {totalExceptions}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center space-x-2 transition-all ${
                toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'
              }`}
            >
              <span>{toast.message}</span>
            </div>
          )}

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {/* 1. OVERVIEW TAB */}
            {activeTab === 'overview' && (
              <div className="space-y-6">
                {/* Notice if unknown payment balances exist */}
                {summary?.totals?.unknownBalancesCount > 0 && (
                  <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-md">
                    <div className="flex">
                      <div className="flex-shrink-0 text-amber-400 font-bold">!</div>
                      <div className="ml-3">
                        <p className="text-sm font-medium text-amber-800">
                          {summary.totals.unknownBalancesCount} deal(s) currently have PAYMENT_INFO_UNAVAILABLE.
                          Unknown balances are strictly preserved and never fabricated as zero.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {/* KPI Metric Cards Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {/* Card 1: Total Contract Value */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Contract Value</p>
                    <p className="text-2xl font-bold text-slate-900 mt-2">
                      {formatCurrency(summary?.totals?.totalContractValue, summary?.activeCurrency)}
                    </p>
                    <p className="text-xs text-slate-500 mt-1">
                      Confirmed SOs: {summary?.totals?.confirmedSalesOrdersCount || 0} ({formatCurrency(summary?.totals?.confirmedSalesOrdersTotal, summary?.activeCurrency)})
                    </p>
                  </div>

                  {/* Card 2: Total Invoiced */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Invoiced</p>
                    <p className="text-2xl font-bold text-indigo-600 mt-2">
                      {formatCurrency(summary?.totals?.totalInvoiced, summary?.activeCurrency)}
                    </p>
                    <p className="text-xs text-slate-500 mt-1">
                      Not Yet Invoiced: <span className="font-semibold">{formatCurrency(summary?.totals?.amountNotInvoiced, summary?.activeCurrency)}</span>
                    </p>
                  </div>

                  {/* Card 3: Total Collected */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Collected</p>
                    <p className="text-2xl font-bold text-emerald-600 mt-2">
                      {formatCurrency(summary?.totals?.totalCollected, summary?.activeCurrency)}
                    </p>
                    <p className="text-xs text-slate-500 mt-1">
                      Contract Collection:{' '}
                      <span className="font-semibold">
                        {summary?.totals?.totalContractValue > 0
                          ? ((summary.totals.totalCollected / summary.totals.totalContractValue) * 100).toFixed(1)
                          : 0}
                        %
                      </span>
                    </p>
                  </div>

                  {/* Card 4: Total Outstanding & Overdue */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Invoiced But Unpaid</p>
                    <p className="text-2xl font-bold text-amber-600 mt-2">
                      {formatCurrency(summary?.totals?.amountInvoicedUnpaid, summary?.activeCurrency)}
                    </p>
                    <p className="text-xs text-rose-600 font-semibold mt-1">
                      Overdue Outstanding: {formatCurrency(summary?.totals?.totalOverdue, summary?.activeCurrency)}
                    </p>
                  </div>
                </div>

                {/* Secondary Metric Bar */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs font-medium text-slate-500">Customers with Outstanding Balances</p>
                      <p className="text-xl font-bold text-slate-900 mt-1">{summary?.totals?.customersWithOutstandingCount || 0}</p>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold">
                      👥
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs font-medium text-slate-500">Deals Awaiting Next Milestone</p>
                      <p className="text-xl font-bold text-slate-900 mt-1">{summary?.totals?.dealsAwaitingMilestonesCount || 0}</p>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 font-bold">
                      ⏳
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="text-xs font-medium text-slate-500">Pending / Failed Webhook Events</p>
                      <p className="text-xl font-bold text-slate-900 mt-1">
                        {summary?.operationalCounts?.pendingEventsCount || 0} Pending /{' '}
                        <span className="text-rose-600">{summary?.operationalCounts?.failedEventsCount || 0} Failed</span>
                      </p>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center text-rose-600 font-bold">
                      ⚡
                    </div>
                  </div>
                </div>

                {/* Visual Contract Fulfillment Breakdown */}
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4">
                    Contract Lifecycle & Cash Realization (Gross AED Basis)
                  </h3>

                  <div className="space-y-4">
                    <div>
                      <div className="flex justify-between text-xs font-medium text-slate-600 mb-1">
                        <span>
                          Collected: {formatCurrency(summary?.totals?.totalCollected)} (
                          {summary?.totals?.totalContractValue > 0
                            ? ((summary.totals.totalCollected / summary.totals.totalContractValue) * 100).toFixed(1)
                            : 0}
                          %)
                        </span>
                        <span>
                          Invoiced Unpaid: {formatCurrency(summary?.totals?.amountInvoicedUnpaid)}
                        </span>
                        <span>
                          Not Yet Invoiced: {formatCurrency(summary?.totals?.amountNotInvoiced)}
                        </span>
                      </div>
                      <div className="w-full h-4 bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                        <div
                          style={{
                            width: `${
                              summary?.totals?.totalContractValue > 0
                                ? (summary.totals.totalCollected / summary.totals.totalContractValue) * 100
                                : 0
                            }%`
                          }}
                          className="bg-emerald-500 h-full"
                          title="Collected"
                        ></div>
                        <div
                          style={{
                            width: `${
                              summary?.totals?.totalContractValue > 0
                                ? (summary.totals.amountInvoicedUnpaid / summary.totals.totalContractValue) * 100
                                : 0
                            }%`
                          }}
                          className="bg-amber-400 h-full"
                          title="Invoiced Unpaid"
                        ></div>
                        <div
                          style={{
                            width: `${
                              summary?.totals?.totalContractValue > 0
                                ? (summary.totals.amountNotInvoiced / summary.totals.totalContractValue) * 100
                                : 0
                            }%`
                          }}
                          className="bg-slate-300 h-full"
                          title="Not Invoiced"
                        ></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. COLLECTIONS & AGING TAB */}
            {activeTab === 'collections' && (
              <div className="space-y-6">
                {/* Search & Actions Bar */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                  <div className="flex-1 min-w-[260px]">
                    <input
                      type="text"
                      placeholder="Search by customer name, email, deal ID, invoice reference..."
                      value={collectionsSearch}
                      onChange={(e) => {
                        setCollectionsSearch(e.target.value);
                        setCollectionsPage(1);
                      }}
                      className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div className="text-xs text-slate-500 font-medium">
                    Aging computed strictly from Zoho invoice due dates. Excludes fully paid and unconfirmed milestones.
                  </div>
                </div>

                {/* Aging Summary KPI Banner */}
                {collectionsData?.agingSummaryTotals && (
                  <div className="grid grid-cols-2 sm:grid-cols-6 gap-3">
                    <div className="bg-white p-3 rounded-lg border border-slate-200 text-center">
                      <p className="text-[11px] font-semibold text-slate-500 uppercase">Current</p>
                      <p className="text-sm font-bold text-emerald-600 mt-1">
                        {formatCurrency(collectionsData.agingSummaryTotals.current)}
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 text-center">
                      <p className="text-[11px] font-semibold text-slate-500 uppercase">1-30 Days</p>
                      <p className="text-sm font-bold text-amber-600 mt-1">
                        {formatCurrency(collectionsData.agingSummaryTotals.days1To30)}
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 text-center">
                      <p className="text-[11px] font-semibold text-slate-500 uppercase">31-60 Days</p>
                      <p className="text-sm font-bold text-orange-600 mt-1">
                        {formatCurrency(collectionsData.agingSummaryTotals.days31To60)}
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 text-center">
                      <p className="text-[11px] font-semibold text-slate-500 uppercase">61-90 Days</p>
                      <p className="text-sm font-bold text-rose-500 mt-1">
                        {formatCurrency(collectionsData.agingSummaryTotals.days61To90)}
                      </p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200 text-center">
                      <p className="text-[11px] font-semibold text-slate-500 uppercase">90+ Days</p>
                      <p className="text-sm font-bold text-rose-700 mt-1">
                        {formatCurrency(collectionsData.agingSummaryTotals.days90Plus)}
                      </p>
                    </div>
                    <div className="bg-slate-900 p-3 rounded-lg text-center text-white">
                      <p className="text-[11px] font-semibold text-slate-300 uppercase">Total Outstanding</p>
                      <p className="text-sm font-bold text-white mt-1">
                        {formatCurrency(collectionsData.agingSummaryTotals.totalOutstanding)}
                      </p>
                    </div>
                  </div>
                )}

                {/* Collections Table */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="min-w-full divide-y divide-slate-200 text-sm text-left">
                      <thead className="bg-slate-50 text-slate-600 font-semibold text-xs uppercase tracking-wider">
                        <tr>
                          <th className="px-4 py-3">Customer</th>
                          <th className="px-3 py-3 text-right">Current</th>
                          <th className="px-3 py-3 text-right">1-30d</th>
                          <th className="px-3 py-3 text-right">31-60d</th>
                          <th className="px-3 py-3 text-right">61-90d</th>
                          <th className="px-3 py-3 text-right">90d+</th>
                          <th className="px-4 py-3 text-right">Outstanding</th>
                          <th className="px-4 py-3">Oldest Unpaid Invoice</th>
                          <th className="px-3 py-3 text-center">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {collectionsData?.customers?.length === 0 ? (
                          <tr>
                            <td colSpan="9" className="px-4 py-8 text-center text-slate-500 text-sm">
                              No active customer outstanding balances found.
                            </td>
                          </tr>
                        ) : (
                          collectionsData?.customers?.map((cust) => (
                            <tr key={cust.customerId} className="hover:bg-slate-50 transition">
                              <td className="px-4 py-3">
                                <div className="font-semibold text-slate-900">{cust.customerName}</div>
                                <div className="text-xs text-slate-500">{cust.customerEmail || cust.customerId}</div>
                              </td>
                              <td className="px-3 py-3 text-right text-slate-700">{formatCurrency(cust.current)}</td>
                              <td className="px-3 py-3 text-right font-medium text-amber-600">{cust.days1To30 > 0 ? formatCurrency(cust.days1To30) : '—'}</td>
                              <td className="px-3 py-3 text-right font-medium text-orange-600">{cust.days31To60 > 0 ? formatCurrency(cust.days31To60) : '—'}</td>
                              <td className="px-3 py-3 text-right font-medium text-rose-500">{cust.days61To90 > 0 ? formatCurrency(cust.days61To90) : '—'}</td>
                              <td className="px-3 py-3 text-right font-bold text-rose-700">{cust.days90Plus > 0 ? formatCurrency(cust.days90Plus) : '—'}</td>
                              <td className="px-4 py-3 text-right font-bold text-slate-900">{formatCurrency(cust.totalOutstanding)}</td>
                              <td className="px-4 py-3 text-xs">
                                {cust.oldestUnpaidInvoice ? (
                                  <div>
                                    <span className="font-semibold text-slate-800">
                                      {cust.oldestUnpaidInvoice.invoiceNumber || cust.oldestUnpaidInvoice.referenceNumber || cust.oldestUnpaidInvoice.invoiceId}
                                    </span>
                                    <div className="text-slate-500">
                                      Due: {cust.oldestUnpaidInvoice.dueDate ? new Date(cust.oldestUnpaidInvoice.dueDate).toLocaleDateString() : '—'}
                                    </div>
                                  </div>
                                ) : (
                                  '—'
                                )}
                              </td>
                              <td className="px-3 py-3 text-center">
                                {cust.relatedDeals?.length > 0 && (
                                  <button
                                    onClick={() =>
                                      setConfirmModal({
                                        isOpen: true,
                                        title: 'Trigger Payment Sync',
                                        message: `Poll Zoho Books directly for latest payments on deal ${cust.relatedDeals[0]}?`,
                                        actionType: 'SYNC_PAYMENTS',
                                        payload: { crmDealId: cust.relatedDeals[0] },
                                        isExecuting: false
                                      })
                                    }
                                    className="px-2.5 py-1 text-xs font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded border border-indigo-200 transition"
                                  >
                                    Sync Payments
                                  </button>
                                )}
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>

                  {/* Pagination Footer */}
                  {collectionsData?.pagination && collectionsData.pagination.totalPages > 1 && (
                    <div className="px-4 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-xs text-slate-500">
                      <span>
                        Page {collectionsData.pagination.page} of {collectionsData.pagination.totalPages} ({collectionsData.pagination.totalRecords} customers)
                      </span>
                      <div className="space-x-2">
                        <button
                          disabled={collectionsData.pagination.page <= 1}
                          onClick={() => setCollectionsPage((p) => Math.max(1, p - 1))}
                          className="px-3 py-1 bg-white border border-slate-300 rounded text-slate-700 disabled:opacity-50"
                        >
                          Previous
                        </button>
                        <button
                          disabled={!collectionsData.pagination.hasMore}
                          onClick={() => setCollectionsPage((p) => p + 1)}
                          className="px-3 py-1 bg-white border border-slate-300 rounded text-slate-700 disabled:opacity-50"
                        >
                          Next
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 3. LOGS & ACTIVITY TAB */}
            {activeTab === 'logs' && (
              <div className="space-y-6">
                {/* Queue Summary Banner */}
                {eventsData?.queueStats && (
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="bg-white p-3 rounded-lg border border-slate-200">
                      <p className="text-xs font-semibold text-slate-500">RECEIVED (Queue)</p>
                      <p className="text-lg font-bold text-sky-600 mt-1">{eventsData.queueStats.received || 0}</p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200">
                      <p className="text-xs font-semibold text-slate-500">PROCESSING (Active)</p>
                      <p className="text-lg font-bold text-amber-600 mt-1">{eventsData.queueStats.processing || 0}</p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200">
                      <p className="text-xs font-semibold text-slate-500">PROCESSED (Completed)</p>
                      <p className="text-lg font-bold text-emerald-600 mt-1">{eventsData.queueStats.processed || 0}</p>
                    </div>
                    <div className="bg-white p-3 rounded-lg border border-slate-200">
                      <p className="text-xs font-semibold text-slate-500">FAILED (Need Action)</p>
                      <p className="text-lg font-bold text-rose-600 mt-1">{eventsData.queueStats.failed || 0}</p>
                    </div>
                  </div>
                )}

                {/* Filter Controls */}
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-3 items-center">
                  <select
                    value={logsFilter.system}
                    onChange={(e) => setLogsFilter({ ...logsFilter, system: e.target.value })}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  >
                    <option value="">All Systems</option>
                    <option value="CRM">HubSpot CRM</option>
                    <option value="ZOHO_BOOKS">Zoho Books</option>
                  </select>

                  <select
                    value={logsFilter.isSuccess}
                    onChange={(e) => setLogsFilter({ ...logsFilter, isSuccess: e.target.value })}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs"
                  >
                    <option value="">All Outcomes</option>
                    <option value="true">Success (2xx)</option>
                    <option value="false">Errors (4xx, 5xx)</option>
                  </select>

                  <input
                    type="text"
                    placeholder="Search by Deal ID or Endpoint..."
                    value={logsFilter.search}
                    onChange={(e) => setLogsFilter({ ...logsFilter, search: e.target.value })}
                    className="px-3 py-2 border border-slate-300 rounded-lg text-xs flex-1 min-w-[200px]"
                  />
                </div>

                {/* Logs Table */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="min-w-full divide-y divide-slate-200 text-xs text-left">
                      <thead className="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider">
                        <tr>
                          <th className="px-4 py-3">Timestamp</th>
                          <th className="px-3 py-3">System</th>
                          <th className="px-3 py-3">Method & Endpoint</th>
                          <th className="px-3 py-3">Deal ID</th>
                          <th className="px-3 py-3 text-center">Status</th>
                          <th className="px-3 py-3 text-right">Latency</th>
                          <th className="px-4 py-3">Payload Details (Redacted)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 font-mono">
                        {logsData?.logs?.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="px-4 py-6 text-center text-slate-500 font-sans">
                              No integration audit logs found.
                            </td>
                          </tr>
                        ) : (
                          logsData?.logs?.map((log) => (
                            <tr key={log._id} className="hover:bg-slate-50">
                              <td className="px-4 py-2.5 text-slate-600 whitespace-nowrap font-sans">
                                {new Date(log.timestamp).toLocaleTimeString()} {new Date(log.timestamp).toLocaleDateString()}
                              </td>
                              <td className="px-3 py-2.5 whitespace-nowrap">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  log.system === 'CRM' ? 'bg-orange-100 text-orange-800' : 'bg-blue-100 text-blue-800'
                                }`}>
                                  {log.system}
                                </span>
                              </td>
                              <td className="px-3 py-2.5 whitespace-nowrap font-semibold text-slate-800">
                                <span className="text-slate-500 mr-1">{log.method}</span>
                                {log.endpoint}
                              </td>
                              <td className="px-3 py-2.5 text-slate-700 whitespace-nowrap font-sans">
                                {log.crmDealId || '—'}
                              </td>
                              <td className="px-3 py-2.5 text-center whitespace-nowrap">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  log.isSuccess ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                                }`}>
                                  {log.statusCode}
                                </span>
                              </td>
                              <td className="px-3 py-2.5 text-right text-slate-600 whitespace-nowrap font-sans">
                                {log.durationMs}ms
                              </td>
                              <td className="px-4 py-2.5 max-w-xs truncate text-slate-500 text-[11px]" title={JSON.stringify(log.responseBody || log.requestBody)}>
                                {JSON.stringify(log.responseBody || log.requestBody || {}).slice(0, 60)}...
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 4. OPERATOR ACTION CENTER TAB */}
            {activeTab === 'operator' && (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white p-4 rounded-xl shadow-md flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-bold">Operator Exception Center</h2>
                    <p className="text-xs text-slate-300">
                      Safe operator intervention for customer ambiguity, retryable sync errors, and webhook queue failures.
                    </p>
                  </div>
                  <span className="px-3 py-1 bg-indigo-600 text-xs font-semibold rounded-md">
                    Auth Status: {operatorKey ? 'Active' : 'Unauthenticated'}
                  </span>
                </div>

                {/* 1. Ambiguous Customer Mappings */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-6 py-4 bg-amber-50 border-b border-amber-100 flex justify-between items-center">
                    <div>
                      <h3 className="text-sm font-bold text-amber-900">
                        Ambiguous Customer Mappings ({exceptionsData?.ambiguousCustomers?.length || 0})
                      </h3>
                      <p className="text-xs text-amber-700">
                        Deals paused because HubSpot company/contact resolved to multiple Zoho candidates.
                      </p>
                    </div>
                  </div>

                  <div className="p-6">
                    {exceptionsData?.ambiguousCustomers?.length === 0 ? (
                      <p className="text-xs text-slate-500">No customer ambiguities pending resolution.</p>
                    ) : (
                      <div className="space-y-6">
                        {exceptionsData.ambiguousCustomers.map((mapping) => (
                          <div key={mapping._id} className="border border-slate-200 rounded-lg p-4 bg-slate-50 space-y-3">
                            <div className="flex justify-between items-start">
                              <div>
                                <span className="text-xs font-bold text-slate-900">
                                  {mapping.companyName || mapping.contactName || 'Ambiguous Entity'}
                                </span>
                                <p className="text-xs text-slate-500">
                                  Company ID: {mapping.hubspotCompanyId || '—'} | Contact Email: {mapping.contactEmail || '—'}
                                </p>
                              </div>
                              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-200 text-amber-900">
                                Action Required
                              </span>
                            </div>

                            {/* Candidate selection radio group */}
                            <div className="space-y-2 mt-2">
                              <p className="text-xs font-semibold text-slate-700">Choose Verified Zoho Customer Candidate:</p>
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {mapping.candidateMatches?.map((c) => (
                                  <label
                                    key={c.contactId}
                                    className={`flex items-start space-x-2 p-2.5 rounded border text-xs cursor-pointer transition ${
                                      selectedCandidates[mapping._id] === c.contactId
                                        ? 'border-indigo-600 bg-indigo-50 text-indigo-900'
                                        : 'border-slate-300 bg-white hover:bg-slate-100'
                                    }`}
                                  >
                                    <input
                                      type="radio"
                                      name={`candidate_${mapping._id}`}
                                      value={c.contactId}
                                      checked={selectedCandidates[mapping._id] === c.contactId}
                                      onChange={() =>
                                        setSelectedCandidates({ ...selectedCandidates, [mapping._id]: c.contactId })
                                      }
                                      className="mt-0.5"
                                    />
                                    <div>
                                      <p className="font-bold">{c.contactName || c.companyName}</p>
                                      <p className="text-[11px] text-slate-500">Zoho ID: {c.contactId}</p>
                                      {c.email && <p className="text-[11px] text-slate-500">Email: {c.email}</p>}
                                    </div>
                                  </label>
                                ))}
                              </div>
                            </div>

                            <div className="pt-2 flex justify-end">
                              <button
                                disabled={!selectedCandidates[mapping._id]}
                                onClick={() =>
                                  setConfirmModal({
                                    isOpen: true,
                                    title: 'Resolve Customer Ambiguity',
                                    message: `Link customer "${mapping.companyName || mapping.contactName}" to verified Zoho Contact ID "${selectedCandidates[mapping._id]}"?`,
                                    actionType: 'RESOLVE_CUSTOMER',
                                    payload: {
                                      mappingId: mapping._id,
                                      chosenZohoContactId: selectedCandidates[mapping._id]
                                    },
                                    isExecuting: false
                                  })
                                }
                                className="px-3.5 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-md disabled:opacity-40 transition shadow-sm"
                              >
                                Resolve & Link Customer
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* 2. Reconciliation Required */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-6 py-4 bg-rose-50 border-b border-rose-100">
                    <h3 className="text-sm font-bold text-rose-900">
                      Reconciliation Required ({exceptionsData?.reconciliationRequired?.length || 0})
                    </h3>
                    <p className="text-xs text-rose-700">
                      Deals blocked due to network drops during Sales Order or Invoice creation to prevent double POSTs.
                    </p>
                  </div>

                  <div className="p-6">
                    {exceptionsData?.reconciliationRequired?.length === 0 ? (
                      <p className="text-xs text-slate-500">No deals currently in RECONCILIATION_REQUIRED state.</p>
                    ) : (
                      <div className="space-y-3">
                        {exceptionsData.reconciliationRequired.map((deal) => (
                          <div key={deal._id} className="flex justify-between items-center p-3 rounded-lg border border-slate-200 bg-slate-50">
                            <div>
                              <p className="text-xs font-bold text-slate-900">CRM Deal: {deal.crmDealId}</p>
                              <p className="text-[11px] text-slate-500">
                                Reason: {deal.reconciliationReason || deal.failureReason || 'Remote POST uncertain timeout'}
                              </p>
                            </div>
                            <button
                              onClick={() =>
                                setConfirmModal({
                                  isOpen: true,
                                  title: 'Execute Reconciliation',
                                  message: `Re-evaluate remote Zoho Books state for deal ${deal.crmDealId}?`,
                                  actionType: 'RETRY_RECONCILIATION',
                                  payload: { crmDealId: deal.crmDealId },
                                  isExecuting: false
                                })
                              }
                              className="px-3 py-1.5 text-xs font-semibold text-rose-700 bg-rose-100 hover:bg-rose-200 rounded-md transition"
                            >
                              Retry Reconciliation
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* 3. HubSpot Sync Failures */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-6 py-4 bg-orange-50 border-b border-orange-100">
                    <h3 className="text-sm font-bold text-orange-900">
                      HubSpot Sync Failed ({exceptionsData?.hubspotSyncFailed?.length || 0})
                    </h3>
                    <p className="text-xs text-orange-700">
                      Zoho Books operations succeeded, but updating deal properties in HubSpot timed out or failed.
                    </p>
                  </div>

                  <div className="p-6">
                    {exceptionsData?.hubspotSyncFailed?.length === 0 ? (
                      <p className="text-xs text-slate-500">No deals in HUBSPOT_SYNC_FAILED state.</p>
                    ) : (
                      <div className="space-y-3">
                        {exceptionsData.hubspotSyncFailed.map((deal) => (
                          <div key={deal._id} className="flex justify-between items-center p-3 rounded-lg border border-slate-200 bg-slate-50">
                            <div>
                              <p className="text-xs font-bold text-slate-900">CRM Deal: {deal.crmDealId}</p>
                              <p className="text-[11px] text-slate-500">Last error: {deal.failureReason || 'HubSpot API Error'}</p>
                            </div>
                            <button
                              onClick={() =>
                                setConfirmModal({
                                  isOpen: true,
                                  title: 'Retry HubSpot Synchronization',
                                  message: `Push latest Zoho financial metrics to HubSpot deal ${deal.crmDealId}?`,
                                  actionType: 'RETRY_HUBSPOT',
                                  payload: { crmDealId: deal.crmDealId },
                                  isExecuting: false
                                })
                              }
                              className="px-3 py-1.5 text-xs font-semibold text-orange-700 bg-orange-100 hover:bg-orange-200 rounded-md transition"
                            >
                              Retry HubSpot Sync
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* 4. Failed Webhook Events */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-6 py-4 bg-slate-100 border-b border-slate-200">
                    <h3 className="text-sm font-bold text-slate-900">
                      Failed Webhook Events ({exceptionsData?.failedWebhookEvents?.length || 0})
                    </h3>
                    <p className="text-xs text-slate-600">
                      Events that exceeded worker processing retries or encountered unhandled runtime errors.
                    </p>
                  </div>

                  <div className="p-6">
                    {exceptionsData?.failedWebhookEvents?.length === 0 ? (
                      <p className="text-xs text-slate-500">No failed webhook events in queue.</p>
                    ) : (
                      <div className="space-y-3">
                        {exceptionsData.failedWebhookEvents.map((evt) => (
                          <div key={evt._id} className="flex justify-between items-center p-3 rounded-lg border border-slate-200 bg-slate-50">
                            <div>
                              <span className="text-xs font-bold text-slate-900">{evt.eventId}</span>
                              <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-800">{evt.source}</span>
                              <p className="text-[11px] text-rose-600 mt-0.5 font-mono">Error: {evt.error || 'Failed'}</p>
                            </div>
                            <button
                              onClick={() =>
                                setConfirmModal({
                                  isOpen: true,
                                  title: 'Retry Webhook Event',
                                  message: `Re-queue event ${evt.eventId} for immediate worker processing?`,
                                  actionType: 'RETRY_EVENT',
                                  payload: { eventId: evt.eventId },
                                  isExecuting: false
                                })
                              }
                              className="px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-indigo-100 hover:bg-indigo-200 rounded-md transition"
                            >
                              Re-queue Event
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Operator Key Modal */}
          {showKeyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-base font-bold text-slate-900">Operator Authentication Key</h3>
                <p className="text-xs text-slate-500">
                  Protected operator actions require authorization. The key is stored in browser memory/localStorage.
                </p>
                <input
                  type="password"
                  value={tempKey}
                  onChange={(e) => setTempKey(e.target.value)}
                  placeholder="Enter OPERATOR_API_KEY..."
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
                <div className="flex justify-end space-x-2 pt-2">
                  <button
                    onClick={() => setShowKeyModal(false)}
                    className="px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setOperatorKey(tempKey);
                      localStorage.setItem('OPERATOR_KEY', tempKey);
                      setShowKeyModal(false);
                      showToastMessage('Operator key saved.');
                    }}
                    className="px-4 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-md shadow-sm"
                  >
                    Save Key
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Confirmation Action Modal */}
          {confirmModal.isOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-base font-bold text-slate-900">{confirmModal.title}</h3>
                <p className="text-sm text-slate-600">{confirmModal.message}</p>
                <div className="bg-amber-50 p-3 rounded-lg border border-amber-200 text-xs text-amber-800">
                  ⚠️ This consequential operation modifies sync and financial state.
                </div>
                <div className="flex justify-end space-x-2 pt-2">
                  <button
                    disabled={confirmModal.isExecuting}
                    onClick={() =>
                      setConfirmModal({ isOpen: false, title: '', message: '', actionType: null, payload: null, isExecuting: false })
                    }
                    className="px-3.5 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md disabled:opacity-50"
                  >
                    Cancel
                  </button>
                  <button
                    disabled={confirmModal.isExecuting}
                    onClick={handleExecuteOperatorAction}
                    className="px-4 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-md shadow-sm disabled:opacity-50 flex items-center space-x-1.5"
                  >
                    {confirmModal.isExecuting ? (
                      <>
                        <span className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        <span>Executing...</span>
                      </>
                    ) : (
                      <span>Confirm & Execute</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
